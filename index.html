<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedBridge | Audio Capture</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-high": "#e1eaed",
              "surface-container-lowest": "#ffffff",
              "tertiary-container": "#915239",
              "inverse-surface": "#293234",
              "on-surface": "#141d1f",
              "primary": "#00535b",
              "primary-fixed-dim": "#82d3de",
              "surface-dim": "#d2dcde",
              "secondary-fixed": "#acefe7",
              "on-secondary": "#ffffff",
              "surface-bright": "#f2fbfe",
              "on-primary-container": "#9becf7",
              "primary-fixed": "#9ff0fb",
              "surface-container": "#e6eff2",
              "on-tertiary-container": "#ffd7c9",
              "surface-tint": "#006972",
              "tertiary-fixed": "#ffdbce",
              "tertiary": "#743b24",
              "surface-variant": "#dbe4e7",
              "background": "#f2fbfe",
              "outline": "#6f797a",
              "error-container": "#ffdad6",
              "on-tertiary-fixed-variant": "#6f3720",
              "on-secondary-fixed": "#00201e",
              "on-secondary-fixed-variant": "#00504b",
              "on-error-container": "#93000a",
              "on-background": "#141d1f",
              "on-primary-fixed": "#001f23",
              "inverse-on-surface": "#e9f2f5",
              "on-surface-variant": "#3e494a",
              "tertiary-fixed-dim": "#ffb59a",
              "surface": "#f2fbfe",
              "inverse-primary": "#82d3de",
              "secondary-fixed-dim": "#90d3cb",
              "on-tertiary-fixed": "#380d00",
              "on-primary-fixed-variant": "#004f56",
              "surface-container-highest": "#dbe4e7",
              "secondary-container": "#a9ece5",
              "on-error": "#ffffff",
              "on-primary": "#ffffff",
              "error": "#ba1a1a",
              "on-tertiary": "#ffffff",
              "outline-variant": "#bec8ca",
              "primary-container": "#006d77",
              "surface-container-low": "#ecf5f8",
              "secondary": "#236863",
              "on-secondary-container": "#286d67"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-headline { font-family: 'Manrope', sans-serif; }
        .glass-header {
            background: rgba(242, 251, 254, 0.7);
            backdrop-filter: blur(20px);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #bec8ca; border-radius: 10px; }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 83, 91, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(0, 83, 91, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 83, 91, 0); }
        }
        .pulse-recording {
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
